[package]
name = "dbc-replay"
version = "0.1.0"
edition = "2021"
description = "Replays recorded Meteora DBC swaps through the program's own math and checks bit-exact agreement"
license = "MIT"

[dependencies]
# Pool math comes straight from the DBC program code (the same code that runs onchain).
# rev is pinned so the build is reproducible; update deliberately.
dynamic-bonding-curve = { git = "https://github.com/MeteoraAg/dynamic-bonding-curve", rev = "f552f20aa3c1c7631427c3827aeea7c58b902813", features = ["no-entrypoint"] }
anchor-lang = "1.0.2"
anyhow = "1"
bytemuck = "1.21"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
# config-dump: reading pool/config accounts over RPC (HISTORY_RPC_URL or RPC_URL)
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
